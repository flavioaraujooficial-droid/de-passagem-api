<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Passagem - Painel ADM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen p-4 max-w-4xl mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl font-black text-amber-400">Painel ADM</h1>
            <p class="text-xs text-gray-400">De Passagem - Operação Alagoinhas</p>
        </div>
        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold">Sistema On</span>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <p class="text-xs text-gray-400 uppercase">Taxas do App (R$ 1,00)</p>
            <p class="text-2xl font-black text-emerald-400 mt-1">R$ 48,00</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <p class="text-xs text-gray-400 uppercase">Motoristas Ativos</p>
            <p class="text-2xl font-black text-amber-400 mt-1">12</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <p class="text-xs text-gray-400 uppercase">Corridas Hoje</p>
            <p class="text-2xl font-black text-sky-400 mt-1">48</p>
        </div>
    </div>

    <section class="bg-slate-900 rounded-2xl border border-slate-800 p-4">
        <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wider mb-4">Últimas Corridas em Alagoinhas</h2>
        <div class="space-y-3">
            <div class="p-3 bg-slate-950 rounded-xl flex justify-between items-center border border-slate-800 text-xs">
                <div>
                    <p class="font-bold text-white">Centro ➔ Atacadão</p>
                    <p class="text-gray-500">Passageiro: Flávio | Motorista: Confirmado</p>
                </div>
                <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-bold">Concluída (R$ 1,00)</span>
            </div>
        </div>
    </section>
</body>
</html>
