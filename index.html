<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Passagem - Mobilidade Urbana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 text-center">

  <!-- TOPO: LOGO E TITULO -->
  <header class="mt-12 flex flex-col items-center">
    <div class="flex items-center gap-3 mb-2">
      <i class="fa-solid fa-route text-amber-500 text-3xl"></i>
      <span class="text-xl font-semibold tracking-wide text-gray-300">De Passagem</span>
    </div>
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-wider text-white uppercase mb-3">
      DE PASSAGEM
    </h1>
    <p class="text-amber-500 text-sm md:text-base font-semibold tracking-widest uppercase">
      MOBILIDADE QUE CONECTA. RESPEITO QUE TRANSFORMA.
    </p>
  </header>

  <!-- RODAPÉ: PILARES DO PROJETO -->
  <footer class="w-full max-w-3xl mb-10">
    <div class="grid grid-cols-5 gap-2 md:gap-4 border-t border-gray-800 pt-8">
      
      <div class="flex flex-col items-center">
        <i class="fa-solid fa-shield-halved text-amber-500 text-xl md:text-2xl mb-2"></i>
        <span class="text-xs md:text-sm font-medium text-gray-300">Segurança</span>
      </div>

      <div class="flex flex-col items-center">
        <i class="fa-solid fa-users text-amber-500 text-xl md:text-2xl mb-2"></i>
        <span class="text-xs md:text-sm font-medium text-gray-300">Compartilhado</span>
      </div>

      <div class="flex flex-col items-center">
        <i class="fa-solid fa-[#00ff88] fa-hand-holding-dollar text-amber-500 text-xl md:text-2xl mb-2"></i>
        <span class="text-xs md:text-sm font-medium text-gray-300">Tarifa Justa</span>
      </div>

      <div class="flex flex-col items-center">
        <i class="fa-solid fa-leaf text-amber-500 text-xl md:text-2xl mb-2"></i>
        <span class="text-xs md:text-sm font-medium text-gray-300">Social</span>
      </div>

      <div class="flex flex-col items-center">
        <i class="fa-solid fa-heart text-amber-500 text-xl md:text-2xl mb-2"></i>
        <span class="text-xs md:text-sm font-medium text-gray-300">Humano</span>
      </div>

    </div>
  </footer>

</body>
</html>
